<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-label="A road camera and airborne camera share a hazard-cue interface, but require separate training and assurance evidence before navigation acts.">
  <style>
    .vtitle{font-family:Arial,sans-serif;font-size:31px;font-weight:700;fill:#103452}.vsub{font-family:Arial,sans-serif;font-size:16px;fill:#4e6473}.vhead{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#103452}.vtext{font-family:Arial,sans-serif;font-size:15px;fill:#183142}.vsmall{font-family:Arial,sans-serif;font-size:14px;fill:#465e70}.road{fill:#e9f3fa;stroke:#2879ad;stroke-width:2}.air{fill:#f7efff;stroke:#8662a7;stroke-width:2}.cue{fill:#e7f4ed;stroke:#28734d;stroke-width:3}.card{fill:#fffefa;stroke:#8aa4b8;stroke-width:2}.warn{fill:#fff4db;stroke:#c68519;stroke-width:2}.arrow{fill:none;stroke:#2879ad;stroke-width:3}.sep{stroke:#d9e4ea;stroke-width:2}
  </style>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L10 3 L0 6 Z" fill="#2879ad"/></marker></defs>
  <rect width="1200" height="770" fill="#f7fafc"/>
  <text x="55" y="54" class="vtitle">One vision cue; separate road and air safety cases</text>
  <text x="55" y="83" class="vsub">The shared part is the interface. Data, weights, tracking and allowed actions must be argued for each release.</text>
  <rect x="75" y="115" width="445" height="142" rx="14" class="road"/>
  <text x="101" y="151" class="vhead">Road camera: partly hidden cyclist</text>
  <text x="101" y="182" class="vtext">Near a van and the planned lane crossing</text>
  <text x="101" y="210" class="vsmall">Own camera, labels, background, speed and ODD</text>
  <rect x="680" y="115" width="445" height="142" rx="14" class="air"/>
  <text x="706" y="151" class="vhead">Air camera: distant aircraft</text>
  <text x="706" y="182" class="vtext">Small target against sky or terrain</text>
  <text x="706" y="210" class="vsmall">Own camera, labels, geometry, weather and airspace</text>
  <path d="M297 257 V298 H455" class="arrow" marker-end="url(#arr)"/>
  <path d="M902 257 V298 H745" class="arrow" marker-end="url(#arr)"/>
  <rect x="455" y="270" width="290" height="135" rx="16" class="cue"/>
  <text x="480" y="305" class="vhead">Shared cue interface</text>
  <text x="480" y="336" class="vtext">Candidate + image position</text>
  <text x="480" y="361" class="vtext">Time + uncertainty / unknown</text>
  <text x="480" y="385" class="vsmall">No direct steering or range claim</text>
  <path d="M600 405 V447" class="arrow" marker-end="url(#arr)"/>
  <line x1="75" y1="437" x2="1125" y2="437" class="sep"/>
  <text x="75" y="478" class="vhead">The evidence required before the cue can influence navigation</text>
  <rect x="75" y="500" width="240" height="145" rx="12" class="card"/>
  <text x="93" y="531" class="vhead">1. Define and label</text>
  <text x="93" y="560" class="vtext">Sensor view; occlusion;</text><text x="93" y="582" class="vtext">unknown; missing scenes.</text>
  <text x="93" y="617" class="vsmall">Risk: wrong or ambiguous labels</text>
  <rect x="345" y="500" width="240" height="145" rx="12" class="card"/>
  <text x="363" y="531" class="vhead">2. Learn and log</text>
  <text x="363" y="560" class="vtext">Candidate models; splits;</text><text x="363" y="582" class="vtext">augmentation; thresholds.</text>
  <text x="363" y="617" class="vsmall">Risk: underfit or shortcut</text>
  <rect x="615" y="500" width="240" height="145" rx="12" class="card"/>
  <text x="633" y="531" class="vhead">3. Challenge unseen</text>
  <text x="633" y="560" class="vtext">Independent scenes;</text><text x="633" y="582" class="vtext">shift, misses and delay.</text>
  <text x="633" y="617" class="vsmall">Risk: leakage or blind spot</text>
  <rect x="885" y="500" width="240" height="145" rx="12" class="card"/>
  <text x="903" y="531" class="vhead">4. Bound the action</text>
  <text x="903" y="560" class="vtext">Track, geometry, planner,</text><text x="903" y="582" class="vtext">monitor and recovery.</text>
  <text x="903" y="617" class="vsmall">Risk: safe cue, unsafe move</text>
  <rect x="75" y="669" width="1050" height="65" rx="12" class="warn"/>
  <text x="98" y="697" class="vhead">Physical limit</text>
  <text x="98" y="721" class="vtext">If two scenes look the same until intervention is too late, training alone cannot supply the missing information.</text>
  <text x="75" y="756" class="vsmall">Project proposal informed by AMLAS v1.1 and the worked assurance case. Boxes are open evidence obligations, not completed tests.</text>
</svg>
