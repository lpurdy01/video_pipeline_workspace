<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Six linked questions take a reader from a hazardous decision through the evidence needed to grant a trained component bounded authority.">
  <style>.f2title{font-family:Arial,sans-serif;font-size:30px;font-weight:700;fill:#103452}.f2sub{font:16px Arial,sans-serif;fill:#4e6473}.f2num{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:white}.f2head{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#103452}.f2text{font:15px Arial,sans-serif;fill:#183142}.f2card{fill:#fffefa;stroke:#8aa4b8;stroke-width:2}.f2circle{fill:#2879ad}.f2link{stroke:#2879ad;stroke-width:4;fill:none}.f2foot{font:italic 15px Arial,sans-serif;fill:#526d7f}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2879ad"/></marker></defs>
  <rect width="1200" height="700" fill="#f7fafc"/>
  <text x="55" y="58" class="f2title">The evidence bridge: six questions before a trained component gets authority</text>
  <text x="55" y="86" class="f2sub">A skimmable version of the project’s eight contracts. Each answer limits the authority of the specific release.</text>
  <path d="M160 195 H1012" class="f2link" marker-end="url(#arrow)"/>
  <circle cx="145" cy="195" r="30" class="f2circle"/><text x="137" y="203" class="f2num">1</text>
  <rect x="65" y="245" width="175" height="155" rx="10" class="f2card"/><text x="85" y="280" class="f2head">What must not</text><text x="85" y="304" class="f2head">happen?</text><text x="85" y="336" class="f2text">Name the hazard,</text><text x="85" y="357" class="f2text">operating domain,</text><text x="85" y="378" class="f2text">and decision role.</text>
  <circle cx="335" cy="195" r="30" class="f2circle"/><text x="327" y="203" class="f2num">2</text>
  <rect x="255" y="245" width="175" height="155" rx="10" class="f2card"/><text x="275" y="280" class="f2head">What can it</text><text x="275" y="304" class="f2head">observe?</text><text x="275" y="336" class="f2text">State sensing limits,</text><text x="275" y="357" class="f2text">latency, faults and</text><text x="275" y="378" class="f2text">shared blind spots.</text>
  <circle cx="525" cy="195" r="30" class="f2circle"/><text x="517" y="203" class="f2num">3</text>
  <rect x="445" y="245" width="175" height="155" rx="10" class="f2card"/><text x="465" y="280" class="f2head">Which exact</text><text x="465" y="304" class="f2head">release?</text><text x="465" y="336" class="f2text">Bind data, labels,</text><text x="465" y="357" class="f2text">weights, processing</text><text x="465" y="378" class="f2text">and installed sensors.</text>
  <circle cx="715" cy="195" r="30" class="f2circle"/><text x="707" y="203" class="f2num">4</text>
  <rect x="635" y="245" width="175" height="155" rx="10" class="f2card"/><text x="655" y="280" class="f2head">What evidence</text><text x="655" y="304" class="f2head">matches the hazard?</text><text x="655" y="336" class="f2text">Test relevant scenes,</text><text x="655" y="357" class="f2text">errors, uncertainty</text><text x="655" y="378" class="f2text">and delay.</text>
  <circle cx="905" cy="195" r="30" class="f2circle"/><text x="897" y="203" class="f2num">5</text>
  <rect x="825" y="245" width="175" height="155" rx="10" class="f2card"/><text x="845" y="280" class="f2head">Can it act</text><text x="845" y="304" class="f2head">safely in time?</text><text x="845" y="336" class="f2text">Trace error through</text><text x="845" y="357" class="f2text">planning, dynamics,</text><text x="845" y="378" class="f2text">monitor and recovery.</text>
  <circle cx="1095" cy="195" r="30" class="f2circle"/><text x="1087" y="203" class="f2num">6</text>
  <rect x="1015" y="245" width="140" height="155" rx="10" class="f2card"/><text x="1035" y="280" class="f2head">What changes</text><text x="1035" y="304" class="f2head">reopen it?</text><text x="1035" y="336" class="f2text">A data, model,</text><text x="1035" y="357" class="f2text">sensor or ODD</text><text x="1035" y="378" class="f2text">change is a release.</text>
  <rect x="125" y="480" width="950" height="105" rx="12" fill="#e7f4ed" stroke="#28734d" stroke-width="2"/>
  <text x="160" y="520" class="f2head">Decision rule</text><text x="160" y="551" class="f2text">If an answer is missing or does not support the stated hazard, reduce the component’s authority or block the release.</text><text x="160" y="575" class="f2foot">This is an assurance argument for a frozen trained release, not a model-safety score.</text>
  <text x="55" y="650" class="f2foot">Project proposal synthesized from the FAA framing, AMLAS, authority guidance, and evidence-method research.</text>
</svg>
